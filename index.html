<!DOCTYPE html>
<html>
<head>
    <title>Er Library</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            margin: 0;
        }

        .page {
            display: none;
            background-color: white;
            width: 80%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        nav {
            background-color: #1976d2;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        h1 {
            color: #0d47a1;
        }

        h2 {
            color: #1565c0;
        }

        h3 {
            color: #ef6c00;
        }

        input[type="submit"] {
            background-color: #1976d2;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
        }
    </style>

    <script>
        function showPage(pageId) {
            var pages = document.getElementsByClassName("page");
            for (var i = 0; i < pages.length; i++) {
                pages[i].style.display = "none";
            }
            document.getElementById(pageId).style.display = "block";
        }

        function logout() {
            var forms = document.getElementsByTagName("form");
            for (var i = 0; i < forms.length; i++) {
                forms[i].reset();
            }
            showPage('login');
        }
    </script>

</head>

<body onload="showPage('login')">
