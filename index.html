<!DOCTYPE html>
<html>
<head>
    <title>Er Library</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            margin: 0;
        }

        .page {
            display: none;
            background-color: white;
            width: 80%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        nav {
            background-color: #1976d2;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        h1 { color: #0d47a1; }
        h2 { color: #1565c0; }
        h3 { color: #ef6c00; }

        input[type="submit"] {
            background-color: #1976d2;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
        }
    </style>

    <script>
        function showPage(pageId) {
            var pages = document.getElementsByClassName("page");
            for (var i = 0; i < pages.length; i++) {
                pages[i].style.display = "none";
            }
            document.getElementById(pageId).style.display = "block";
        }

        function logout() {
            var forms = document.getElementsByTagName("form");
            for (var i = 0; i < forms.length; i++) {
                forms[i].reset();
            }
            showPage('login');
        }
    </script>
</head>

<body onload="showPage('login')">

<div id="login" class="page">
    <h2>Login to Er Library</h2>
    <form onsubmit="showPage('home'); return false;">
        Email:<br>
        <input type="email"><br><br>
        Password:<br>
        <input type="password"><br><br>
        <input type="submit" value="Login">
    </form>
    <p>Pengguna baru?
        <a href="#" onclick="showPage('register')">Daftar di sini</a>
    </p>
</div>

<div id="register" class="page">
    <h2>Pendaftaran Pengguna Baru</h2>
    <form onsubmit="showPage('login'); return false;">
        Last Name:<br>
        <input type="text"><br><br>
        First Name:<br>
        <input type="text"><br><br>
        Email:<br>
        <input type="email"><br><br>
        No Handphone:<br>
        <input type="text"><br><br>
        Password:<br>
        <input type="password"><br><br>
        <input type="submit" value="Daftar">
    </form>
</div>

<div id="home" class="page">
    <nav>
        <a href="#" onclick="showPage('home')">Home</a>
        <a href="#" onclick="showPage('collection')">Collection</a>
        <a href="#" onclick="showPage('service')">Service</a>
        <a href="#" onclick="showPage('about')">About Us</a>
        <a href="#" onclick="showPage('contact')">Contact Us</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>

    <hr>

    <h1>SELAMAT DATANG DI WEB SAYA</h1>
    <p>Haii, nama saya Erika Lusiana Batubara.</p>
</div>

</body>
</html>
